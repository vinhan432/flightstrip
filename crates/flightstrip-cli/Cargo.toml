[package]
name = "flightstrip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flightstrip CLI: record, inspect and export agent coding sessions."

[[bin]]
name = "flightstrip"
path = "src/main.rs"

[dependencies]
flightstrip-core = { path = "../flightstrip-core" }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
